name: QuipMac
options:
  bundleIdPrefix: com.quip
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0
targets:
  QuipMac:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "*.entitlements"
          - "*.xcodeproj/**"
          - "Resources/cloudflared"
          - "build/**"
          - "Tests/**"
      - path: ../Shared
        excludes:
          - "Tests/**"
    dependencies:
      - package: WhisperKit
    preBuildScripts:
      - script: |
          # cloudflared is not committed (issue #16) — fetch + checksum-verify
          # the pinned upstream release into Resources/ before it gets bundled.
          "${SRCROOT}/../tools/fetch-cloudflared.sh"
        name: Fetch cloudflared
    postBuildScripts:
      - script: |
          cp -f "${SRCROOT}/Resources/cloudflared" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/cloudflared"
          chmod +x "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/cloudflared"
        name: Bundle cloudflared
      - script: |
          # Every build names its commit and build time in Info.plist
          # (QuipBuildCommit, QuipBuildDate), shown in the menu bar panel.
          "${SRCROOT}/../tools/stamp-build-info.sh"
        name: Stamp build info
        # The processed Info.plist is an input, so the build runs the stamp
        # after writing it; without this Xcode may process the plist later
        # and discard the stamp.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quip.mac
        PRODUCT_NAME: Quip
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: QuipMac.entitlements
        # GH #33/#13: Developer ID Application gives a stable, team-keyed
        # Designated Requirement (TCC grants survive a rebuild) and needs NO
        # provisioning profile — unlike "Apple Development", which dodges the
        # restricted-entitlement wall that blocked the keychain future-proof.
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: D2PM6R797Q
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Without a scheme, `xcodebuild -target` falls back to the legacy build
    # location (SYMROOT=$PROJECT_DIR/build). SPM package targets then resolve
    # that against their own read-only checkout and the build dies in yyjson /
    # swift-jinja with "module file not found" or "Permission denied". A scheme
    # routes the build through DerivedData the way Xcode.app already does.
    scheme:
      testTargets:
        - QuipMacTests
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Quip
        CFBundleShortVersionString: 1.5.7
        NSAppleEventsUsageDescription: Quip needs to control Terminal and iTerm2 to manage Claude Code sessions.
        NSAccessibilityUsageDescription: Quip needs Accessibility access to arrange and manage windows on your screen.
        NSBonjourServices:
          - _quip._tcp.
          - _quip._tcp
        NSLocalNetworkUsageDescription: Quip uses your local network to connect with the iPhone remote controller app.
  QuipMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: ../Shared/Tests
    dependencies:
      - target: QuipMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quip.QuipMacTests
        GENERATE_INFOPLIST_FILE: "YES"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: D2PM6R797Q
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Quip.app/Contents/MacOS/Quip"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Tests stay on Swift 5 language mode — CI's Xcode 16.4 errors
        # on actor-isolation patterns the local Xcode 26 build accepts.
        SWIFT_VERSION: "5"
        SWIFT_STRICT_CONCURRENCY: minimal
