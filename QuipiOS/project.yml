name: QuipiOS
options:
  bundleIdPrefix: com.quip
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: false
settings:
  base:
    # Stay on Swift 5 language mode for the iOS target. Local builds use
    # Xcode 26 which relaxed many Swift-6-mode isolation errors back to
    # warnings, but CI's Xcode 16.4 still treats them as hard errors and
    # there are too many call sites to retrofit safely right now.
    SWIFT_VERSION: "5"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # One version for the app, its watch app and its Live Activity: App Store
    # validation rejects an embedded bundle whose versions differ from the
    # app's (the watch said 1.4.0 while the app said 1.5.6). The build number
    # is overridden per upload by tools/testflight.sh.
    MARKETING_VERSION: "1.5.7"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  QuipiOS:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "*.xcodeproj/**"
          - "Tests/**"
          - "Signing.xcconfig"
          - "Signing.local.xcconfig"
          - "build/**"
          - "QuipLiveActivity/**"
          - "QuipWatch/**"
      - path: QuipLiveActivity/Shared
      - path: ../Shared
        excludes:
          - "Tests/**"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - target: QuipWatch
        embed: true
    preBuildScripts:
      - script: |
          # Every build names its commit and build time in Info.plist
          # (QuipBuildCommit, QuipBuildDate), shown in Settings; the marketing
          # version alone cannot tell an old install from a new one. Stamps
          # the generated source plist before Xcode processes and signs it.
          "${SRCROOT}/../tools/stamp-build-info.sh"
        name: Stamp build info
        outputFiles:
          - $(SRCROOT)/$(INFOPLIST_FILE)
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Quip
        # One source for the app's bundle ID (Signing.xcconfig, overridable in
        # the gitignored Signing.local.xcconfig). The watch and Live Activity
        # IDs derive from it: an App Store upload rejects an embedded watch app
        # whose ID is not prefixed by its parent's, and a watch whose
        # WKCompanionAppBundleIdentifier names a different app never pairs.
        PRODUCT_BUNDLE_IDENTIFIER: $(QUIP_APP_BUNDLE_ID)
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: QuipiOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Quip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        NSSpeechRecognitionUsageDescription: Quip uses speech recognition to transcribe your voice commands for Claude Code.
        NSCameraUsageDescription: Quip uses the camera to scan QR codes for connecting to your Mac, and to capture photos you attach to the active Claude Code terminal.
        NSPhotoLibraryUsageDescription: Quip attaches images you pick from your library to the active Claude Code terminal on your Mac.
        NSMicrophoneUsageDescription: Quip needs microphone access for push-to-talk voice commands.
        NSBonjourServices:
          - _quip._tcp.
          - _quip._tcp
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.fintechadventures.quip
            CFBundleURLSchemes:
              - quip
        # §6.1 — register the .quippack prompt/button pack type so "Open in
        # Quip" appears in the Share Sheet / Files for shared packs.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.fintechadventures.quip.pack
            UTTypeDescription: Quip Pack
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - quippack
        CFBundleDocumentTypes:
          - CFBundleTypeName: Quip Pack
            LSItemContentTypes:
              - com.fintechadventures.quip.pack
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
        NSBluetoothAlwaysUsageDescription: Quip uses Bluetooth to discover and connect to your Mac.
        NSBluetoothPeripheralUsageDescription: Quip uses Bluetooth to discover and connect to your Mac.
        NSLocalNetworkUsageDescription: Quip connects to your Mac over the local network to control Claude Code sessions.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          # NSAllowsLocalNetworking intentionally NOT set — when it's true
          # alongside NSAllowsArbitraryLoads, iOS interprets it as "only local
          # networking is allowed," which blocks Tailscale addresses (they look
          # like the public internet to iOS). Commit f7bb347 originally removed
          # this flag from Info.plist directly but forgot to update project.yml,
          # so every xcodegen regeneration silently re-added it.
          NSAllowsArbitraryLoads: true
  QuipLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - QuipLiveActivity
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QUIP_APP_BUNDLE_ID).liveactivity
        PRODUCT_NAME: QuipLiveActivity
        INFOPLIST_FILE: QuipLiveActivity/Info.plist
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: D2PM6R797Q
        GENERATE_INFOPLIST_FILE: "NO"
        # Embedded in Quip.app, so never installed on its own. "NO" put a second
        # top-level .app in the archive, which made it a Generic Xcode Archive
        # that cannot be exported for TestFlight ("expected one {}").
        SKIP_INSTALL: "YES"
  QuipWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: QuipWatch
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QUIP_APP_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: QuipWatch
        INFOPLIST_FILE: QuipWatch/Info.plist
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        DEVELOPMENT_TEAM: D2PM6R797Q
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        GENERATE_INFOPLIST_FILE: "NO"
        # Embedded in Quip.app, so never installed on its own. "NO" put a second
        # top-level .app in the archive, which made it a Generic Xcode Archive
        # that cannot be exported for TestFlight ("expected one {}").
        SKIP_INSTALL: "YES"
        SWIFT_VERSION: "6.0"
  QuipiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../Shared/Tests
    dependencies:
      - target: QuipiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quip.QuipiOSTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Quip.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Quip"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: minimal
