name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-flight runs for the same ref so a force-push doesn't pile up runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Which jobs actually need to run? GitHub bills macOS runners at 10x Linux,
  # and `apple-mac` + `apple-ios` are the two most expensive jobs here — yet a
  # docs-only or Linux-only change used to start both of them to compile code it
  # could not have touched.
  #
  # This job is ubuntu (1x) and takes seconds. The mapping lives in
  # .github/scripts/changed-scopes.sh so it can be unit-tested without a runner;
  # see changed-scopes-test.sh. It FAILS OPEN — no usable diff means run
  # everything, because a wasted runner costs money and a skipped one ships a
  # regression.
  # --------------------------------------------------------------------------
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apple: ${{ steps.scopes.outputs.apple }}
      rust: ${{ steps.scopes.outputs.rust }}
      android: ${{ steps.scopes.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the mapping still holds
        run: bash .github/scripts/changed-scopes-test.sh

      - name: Resolve changed scopes
        id: scopes
        # A branch name is attacker-controlled on a fork PR, so no `${{ }}`
        # interpolation goes into the shell here — every value arrives as a
        # quoted environment variable.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # An empty list means "unknown" to the script, which answers "run
          # everything". That is the default for workflow_dispatch, a force
          # push (before = all zeros), and a first push of a branch.
          files=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            merge_base="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || true)"
            [ -n "$merge_base" ] && files="$(git diff --name-only "$merge_base" HEAD)"
          elif [ "$EVENT_NAME" = "push" ]; then
            case "$BEFORE_SHA" in
              ''|0000000000000000000000000000000000000000) ;;
              *) files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" 2>/dev/null || true)" ;;
            esac
          fi
          # FAIL OPEN, for real. This block has no `set -e`, and `cat` used to be
          # its last command — so if changed-scopes.sh errored, the pipe wrote
          # nothing, the step still exited 0, every output came back empty, and
          # `needs.changes.outputs.apple == 'true'` went false. A broken mapper
          # SKIPPED both macOS jobs: the exact inversion of the documented
          # design. Note that `exit 1` here would be just as wrong — the
          # dependent jobs would be skipped for a failed `needs` instead.
          # The only correct answer to "I don't know what changed" is everything.
          scopes=""
          if scopes="$(printf '%s\n' "$files" | .github/scripts/changed-scopes.sh)"; then
            : # mapper ran; still verify it actually said something, below
          else
            echo "changed-scopes.sh failed (status $?) — falling open"
            scopes=""
          fi
          case "$scopes" in
            *apple=*) ;;
            *) echo "no usable scope output — falling open"
               scopes=$'apple=true\nrust=true\nandroid=true' ;;
          esac
          printf '%s\n' "$scopes" >> "$GITHUB_OUTPUT"
          echo "--- resolved scopes ---"
          printf '%s\n' "$scopes"

  # --------------------------------------------------------------------------
  # QuipLinux — Rust + GTK4. whisper-rs builds whisper.cpp from source on the
  # first run, so we cache aggressively. Toolchain comes from the system; we
  # don't pin a Rust version yet (Cargo.toml already says edition 2021).
  # --------------------------------------------------------------------------
  rust-linux:
    name: cargo test (QuipLinux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev \
            libcairo2-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libglib2.0-dev \
            cmake clang pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            QuipLinux/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('QuipLinux/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test
        working-directory: QuipLinux
        run: cargo test --features whisper

  # --------------------------------------------------------------------------
  # Apple targets. xcodegen regenerates QuipMac.xcodeproj / QuipiOS.xcodeproj
  # from project.yml on every run — Info.plist is gitignored, so without this
  # the build can't find it. Code signing is forced off; tests don't need it
  # and we don't have a CI signing identity. macos-15 carries Xcode 16, which
  # matches project.yml's `xcodeVersion: "16.0"` requirement.
  # --------------------------------------------------------------------------
  apple-mac:
    name: xcodebuild test (QuipMac)
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen 2.44.1
        # Pin: 2.45.x rewrites source paths to a "common ancestor" basePath
        # so iOS sources mixing `path: .` with `path: ../Shared` end up at
        # repo root instead of QuipiOS/. Pulling the .pkg from the upstream
        # release is the simplest way to lock the version on macos-15.
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo /tmp/xcodegen/xcodegen/install.sh
          xcodegen --version

      - name: Generate Mac project
        working-directory: QuipMac
        run: xcodegen generate

      # QuipMac depends on WhisperKit, which drags in swift-transformers and
      # friends. Without this they are re-cloned and re-resolved on every run,
      # on the runner GitHub bills at 10x. Keyed on the manifest that pins them,
      # so a dependency bump misses the cache and everything else hits it.
      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: ${{ runner.os }}-spm-${{ hashFiles('QuipMac/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build & test
        run: |
          xcodebuild test \
            -project QuipMac/QuipMac.xcodeproj \
            -scheme QuipMac \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

  apple-ios:
    name: xcodebuild test (QuipiOS)
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen 2.44.1
        # Pin: 2.45.x rewrites source paths to a "common ancestor" basePath
        # so iOS sources mixing `path: .` with `path: ../Shared` end up at
        # repo root instead of QuipiOS/. Pulling the .pkg from the upstream
        # release is the simplest way to lock the version on macos-15.
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo /tmp/xcodegen/xcodegen/install.sh
          xcodegen --version

      - name: Generate iOS project
        working-directory: QuipiOS
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: sim
        # Hard-coding `name=iPhone 15` breaks every time GitHub bumps the
        # macos-15 image to a newer Xcode whose default sim runtime drops
        # that device. Resolve to whatever iPhone simulator the runner has
        # available at job time and pass its UDID to xcodebuild.
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list -j devices available \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; \
                ids=[v["udid"] for k in d for v in d[k] if v.get("name","").startswith("iPhone")]; \
                print(ids[0] if ids else "", end="")')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator found on runner" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project QuipiOS/QuipiOS.xcodeproj \
            -scheme QuipiOS \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

  # --------------------------------------------------------------------------
  # QuipAndroid — JVM unit tests only. The whisper.cpp native build (CMake +
  # NDK) only runs when assembling an APK, so `./gradlew test` skips it.
  # --------------------------------------------------------------------------
  android:
    name: gradle test (QuipAndroid)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('QuipAndroid/**/*.gradle.kts', 'QuipAndroid/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: gradle test
        working-directory: QuipAndroid
        run: ./gradlew test --no-daemon
