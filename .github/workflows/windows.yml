name: Windows

# Q-91: the Windows host (QuipWindows/). Separate from ci.yml because ci.yml
# only runs on main and PRs, while Q-91 is built on eb-branch, and the
# Win32 checks need a real Windows desktop that no other job has.
# The repo is public, so Windows runner minutes are free.

on:
  push:
    branches: [eb-branch, main]
    paths:
      - "QuipWindows/**"
      - "tools/fake-windows/**"
      - "tools/build-windows.sh"
      - "Shared/Tests/Fixtures/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "QuipWindows/**"
      - "tools/fake-windows/**"
      - "tools/build-windows.sh"
      - "Shared/Tests/Fixtures/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The same checks tools/check.sh runs on the Mac, natively on Windows:
    # fmt, clippy, and every unit, integration and shared-vector test; then
    # the Win32 UI tests, which only run here and on a real PC.
    name: cargo test (QuipWindows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            QuipWindows/target
          key: windows-cargo-${{ hashFiles('QuipWindows/Cargo.lock') }}
      - name: fmt
        working-directory: QuipWindows
        run: cargo fmt --check
      - name: clippy
        working-directory: QuipWindows
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: QuipWindows
        run: cargo test
      - name: Win32 UI tests
        # Spec 10.5: the real backend against real windows (consoles,
        # Windows Terminal, Notepad, the monitors). One at a time: they
        # share the desktop.
        # QUIP_SELFTEST_RAW_PROBE: the integrity probe's raw SendInput,
        # which bypasses the injector, runs on this throwaway desktop only
        # (never on the owner's PC, where focus could move to a user window).
        working-directory: QuipWindows
        env:
          QUIP_WIN_UI: "1"
          QUIP_SELFTEST_RAW_PROBE: "1"
        run: cargo test --test "win32_*" -- --test-threads=1 --nocapture
      - name: Selftest
        # Spec 10.5: the same cases through `Quip.exe --selftest`, the
        # command the owner runs on the PC. Exit 0 only when every case
        # passed (a SKIP fails the step too). The report path is published
        # first, so the upload finds it even when the run fails.
        # Quip.exe is a GUI program, which PowerShell does not wait for and
        # gives no console: start it with its output in files, wait for that
        # process alone (not its children), then print the output.
        working-directory: QuipWindows
        env:
          QUIP_SELFTEST_RAW_PROBE: "1"
        run: |
          "SELFTEST_DIR=$env:LOCALAPPDATA\Quip\Logs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cargo build
          $p = Start-Process -FilePath .\target\debug\Quip.exe -ArgumentList '--selftest' -NoNewWindow -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\selftest-stdout.txt" -RedirectStandardError "$env:RUNNER_TEMP\selftest-stderr.txt"
          $null = $p.Handle  # keeps the exit code readable after exit
          $p.WaitForExit()
          Get-Content "$env:RUNNER_TEMP\selftest-stderr.txt", "$env:RUNNER_TEMP\selftest-stdout.txt"
          "Quip.exe --selftest exited with $($p.ExitCode)"
          exit $p.ExitCode
      - name: Upload selftest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: ${{ env.SELFTEST_DIR }}\selftest-*.txt
          if-no-files-found: warn

  spike:
    # M0 probe: can a process on this runner bring a window to the front and
    # type into PowerShell / cmd, and which multi-line method is safe?
    # A failure here is a finding about the runner, not a broken build, so
    # the run step may fail without failing the job; the report is the output.
    name: M0 spike (focus, typing, multi-line)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build spike
        working-directory: QuipWindows/spike
        run: cargo build --release
      - name: Run spike
        id: run
        continue-on-error: true
        working-directory: QuipWindows/spike
        run: .\target\release\quip-spike.exe
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-report
          path: ${{ env.LOCALAPPDATA }}\Quip\spike-report-*.txt
          if-no-files-found: warn
