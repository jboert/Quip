[package]
name = "quip-windows"
version = "0.1.0"
edition = "2021"
description = "Quip host for Windows (Q-91): drive a Windows PC from the Quip iPhone app"
publish = false
exclude = ["spike"]

[workspace]
# Standalone crate: the M0 probe in spike/ is its own package and is not
# built from here.
exclude = ["spike"]

[lib]
name = "quip_windows"
path = "src/lib.rs"

[[bin]]
name = "Quip"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "io-std", "signal"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
regex = "1"
base64 = "0.22"
rand = "0.9"
if-addrs = "0.13"
hostname = "0.4"
mdns-sd = "0.11"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.5"
embed-resource = "3.0"

[dev-dependencies]
rqrr = { version = "0.11.0", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util"] }

[profile.release]
opt-level = "s"
